<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Ruby</title>

<style>
* {

}

body {

  font-family: monospace;

#game {

/* =========================
   RUBI PIXEL ART
========================= */

#ruby {
  position: absolute;
  left: 80px;
  bottom: 35px;
  width: 64px;
  height: 64px;
  z-index: 5;

  image-rendering: pixelated;

  animation: float 0.65s ease-in-out infinite alternate;
}

/*
   Rubi construído com CSS em blocos

*/

.ruby-pixel {
  position: absolute;

}

/* Corpo principal */

.p1  { left: 24px; top: 0;  background: #ff5964; }
.p2  { left: 32px; top: 0;  background: #ff5964; }

.p20 { left: 16px; top: 32px; background: #d71938; }
.p21 { left: 24px; top: 32px; background: #c51130; }
.p22 { left: 32px; top: 32px; background: #a90b27; }
.p23 { left: 40px; top: 32px; background: #86061e; }
.p24 { left: 48px; top: 32px; background: #5e0314; }

.p25 { left: 16px; top: 40px; background: #a70a27; }
.p26 { left: 24px; top: 40px; background: #900720; }

/* Brilho pixelado */

.highlight {
  position: absolute;
  left: 16px;
  top: 9px;
  width: 8px;
  height: 16px;
  background: #fff;
  opacity: .8;

  box-shadow:
    8px 0 #ffdce0,
    0 8px #ffdce0;
}

/* Pequeno brilho externo */

.sparkle {
  position: absolute;
  width: 8px;
  height: 8px;
  left: 52px;
  top: 4px;

  background: white;

  box-shadow:
    -8px 8px white,
    0 8px white,
    8px 8px white,
    0 16px white;

  transform: scale(.45);
  opacity: .8;

  animation: sparkle .8s infinite alternate;
}

@keyframes sparkle {
  from {
    opacity: .25;
    transform: scale(.35);
  }

  to {
    opacity: 1;
    transform: scale(.65);
  }
}

/* Flutuação */

@keyframes float {
  from {
    transform: translateY(0);
  }

  to {
    transform: translateY(-5px);
  }
}

/* =========================
   SOMBRA DO RUBI
========================= */

.ruby-shadow {
  position: absolute;
  width: 35px;
  height: 6px;
  left: 15px;
  bottom: -5px;

  background: rgba(0,0,0,.15);

  image-rendering: pixelated;

  animation: shadow 0.65s ease-in-out infinite alternate;
}

@keyframes shadow {
  from {
    transform: scaleX(1);
    opacity: .18;
  }

  to {
    transform: scaleX(.75);
    opacity: .1;
  }
}

/* =========================
   OBSTÁCULO
========================= */

.obstacle {
  position: absolute;
  bottom: 3px;
  width: 22px;
  height: 45px;
  background: #333;
  border-radius: 2px;
}

.obstacle::before {
  content: "";
  position: absolute;
  width: 12px;
  height: 20px;

  left: -7px;
  top: 12px;
}

/* =========================

.cloud {

  background: #eee;
  border-radius: 20px;
  top: 55px;
  left: 100%;
}

.cloud::before,
.cloud::after {
  content: "";

  background: #eee;

}

.cloud::before {
  width: 28px;

}

.cloud::after {
  width: 20px;
  height: 20px;
  top: -8px;
  right: 8px;
}

/* =========================
   SCORE
========================= */

#score {
  position: absolute;
  top: 15px;
  right: 20px;
  font-size: 20px;

}

/* =========================
   TELA INICIAL
========================= */

#message {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;

#message h1 {

button {

}

}

/* =========================
   PULO
========================= */

.jumping {
  animation: jump .55s ease-out !important;
}

@keyframes jump {

  0% {
    bottom: 35px;
  }

  45% {
    bottom: 155px;
  }

  100% {
    bottom: 35px;
  }
}

<div id="game">

  <div id="score">00000</div>

  <!-- RUBI -->
  <div id="ruby">

    <div class="ruby-pixel p25"></div>

    <div class="ruby-pixel p28"></div>
    <div class="ruby-pixel p29"></div>

    <div class="highlight"></div>

    <div class="ruby-shadow"></div>

  </div>

  <div class="cloud"></div>

  <div id="message">
    <h1>💎</h1>
    <p>Pressione ESPAÇO para pular</p>
    <button onclick="startGame()">Jogar</button>
  </div>

</div>

<script>

const game = document.getElementById("game");
const ruby = document.getElementById("ruby");
const scoreElement = document.getElementById("score");
const message = document.getElementById("message");

let playing = false;
let score = 0;
let speed = 6;
let obstacle = null;
let obstacleX = 0;
let animation;
let lastTime = 0;
let obstacleTimer = 0;

function startGame() {

  playing = true;
  score = 0;
  speed = 6;
  obstacleTimer = 0;

  scoreElement.textContent = "00000";
  message.style.display = "none";

  if (obstacle) {
    obstacle.remove();
    obstacle = null;
  }

  lastTime = performance.now();
  animation = requestAnimationFrame(loop);
}

function jump() {

  if (!playing) {
    startGame();
    return;
  }

  if (!ruby.classList.contains("jumping")) {

    ruby.classList.add("jumping");

    setTimeout(() => {
      ruby.classList.remove("jumping");
    }, 550);
  }
}

document.addEventListener("keydown", e => {

  if (
    e.code === "Space" ||
    e.code === "ArrowUp"
  ) {

    e.preventDefault();

    jump();
  }
});

document.addEventListener("touchstart", jump);

function createObstacle() {

  if (obstacle) return;

  obstacle = document.createElement("div");

  obstacle.className = "obstacle";

  game.appendChild(obstacle);

  obstacleX = game.offsetWidth + 20;

  obstacle.style.left =
    obstacleX + "px";
}

function collision() {

  if (!obstacle) return false;

  const r =
    ruby.getBoundingClientRect();

  const o =
    obstacle.getBoundingClientRect();

  return (
    r.left + 12 < o.right &&
    r.right - 12 > o.left &&
    r.top + 10 < o.bottom &&
    r.bottom - 8 > o.top
  );
}

function gameOver() {

  playing = false;

  cancelAnimationFrame(animation);

  message.innerHTML = `
    <h1>💥</h1>
    <p>Pontuação: ${
      Math.floor(score)
        .toString()
        .padStart(5, "0")
    }</p>

    <button onclick="startGame()">
      Jogar novamente
    </button>
  `;

  message.style.display = "flex";
}

function loop(time) {

  if (!playing) return;

  const delta =
    (time - lastTime) / 16.67;

  lastTime = time;

  score += delta * .8;

  scoreElement.textContent =
    Math.floor(score)
      .toString()
      .padStart(5, "0");

  obstacleTimer += delta;

  if (
    obstacleTimer >
    80 + Math.random() * 70
  ) {

    createObstacle();

    obstacleTimer = 0;
  }

  if (obstacle) {

    obstacleX -= speed * delta;

    obstacle.style.left =
      obstacleX + "px";

    if (obstacleX < -40) {

      obstacle.remove();

      obstacle = null;

      speed += .15;
    }
  }

  if (collision()) {

    gameOver();

    return;
  }

  animation =
    requestAnimationFrame(loop);
}

</script>

</body>
